# Nginx del contenedor web: sirve el SPA y hace de proxy hacia la API en el mismo origen.
# En producción, TLS y HSTS se terminan en el proxy/CDN de borde (ver CLAUDE.md, Fase 3).

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Límite de subida: fotos de hasta 8 MB (MAX_IMAGE_SIZE_MB) + margen del multipart
    client_max_body_size 10m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Cabeceras a nivel de server: ninguna location usa add_header, así se heredan en todas.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 60s;
    }

    # Fotos públicas (los comprobantes de pago NO se sirven aquí: van por endpoint autenticado)
    location /static/uploads/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        expires 7d;
    }

    # Assets de Vite con hash en el nombre: caché larga
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # SPA en modo history: cualquier otra ruta devuelve index.html sin caché
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
